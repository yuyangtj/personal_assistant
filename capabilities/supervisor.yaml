id: supervisor
name: Assistant supervisor
kind: agent
description: Handles requests about work. It sees every coding run, starts coding agents on registered repositories, inspects or stops runs, and reports back.
provides:
  - supervision
availability:
  enabled: true
  concurrency: 2
execution:
  adapter: supervisor
  timeout_seconds: 180
risk:
  default_level: 0
  destructive_actions_require_approval: true
routing:
  priority: 30
