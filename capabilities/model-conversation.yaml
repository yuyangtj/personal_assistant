id: model-conversation
name: Model conversation
kind: model
description: Answers everyday requests through the configured chat provider and can propose confirmed phone actions.
provides:
  - conversation
  - task_execution
availability:
  enabled: true
  concurrency: 4
execution:
  adapter: model-conversation
  timeout_seconds: 60
risk:
  default_level: 0
  destructive_actions_require_approval: true
routing:
  priority: 20
