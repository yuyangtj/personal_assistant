id: grocery-agent
name: Grocery agent
kind: agent
description: Answers grocery questions from the user's stores (Willys, Lidl) through read-only MCP tools - offers, receipts, purchases and spending.
provides:
  - groceries
availability:
  enabled: true
  concurrency: 2
execution:
  adapter: grocery-agent
  timeout_seconds: 300
risk:
  default_level: 0
  destructive_actions_require_approval: true
routing:
  priority: 30
