id: tool-agent
name: Web research agent
kind: agent
description: Researches a request with web search over a few steps and answers with sources.
provides:
  - web_research
availability:
  enabled: true
  concurrency: 2
execution:
  adapter: tool-agent
  timeout_seconds: 300
risk:
  default_level: 0
  destructive_actions_require_approval: true
routing:
  priority: 30
