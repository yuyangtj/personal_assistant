id: kimi-conversation
name: Kimi conversation
kind: model
description: Answers everyday requests with short spoken replies using Kimi; cannot take actions.
provides:
  - conversation
  - task_execution
availability:
  enabled: true
  concurrency: 4
execution:
  adapter: kimi-conversation
  timeout_seconds: 60
risk:
  default_level: 0
  destructive_actions_require_approval: true
routing:
  priority: 20
