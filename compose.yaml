services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${ASSISTANT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - assistant-postgres:/var/lib/postgresql/data

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: assistant
    volumes:
      - ./migrations:/migrations:ro
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -h postgres -U assistant -d assistant -v ON_ERROR_STOP=1 -f "$${migration}"; done

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      ASSISTANT_CAPABILITIES_DIRECTORY: /service/capabilities
    ports:
      - "127.0.0.1:${ASSISTANT_API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      ASSISTANT_CAPABILITIES_DIRECTORY: /service/capabilities
      ASSISTANT_WORKER_ID: worker-compose
      # Read from the host environment; never commit keys to this file.
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ASSISTANT_KIMI_MODEL: ${ASSISTANT_KIMI_MODEL:-kimi-for-coding-highspeed}
      ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS: ${ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS:-0.1}
    command: ["python", "-m", "app.worker"]

volumes:
  assistant-postgres:
