name: personal-assistant

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:?set ASSISTANT_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - assistant-postgres:/var/lib/postgresql/data
    networks:
      - database

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:?set ASSISTANT_POSTGRES_PASSWORD}
      ASSISTANT_CODING_POSTGRES_PASSWORD: ${ASSISTANT_CODING_POSTGRES_PASSWORD:?set ASSISTANT_CODING_POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
      - ./deploy/postgres/coding-worker-password.sql:/database/coding-worker-password.sql:ro
    command: ["sh", "/scripts/migrate.sh"]
    networks:
      - database

  api:
    build: .
    image: personal-assistant:${ASSISTANT_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:${ASSISTANT_POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_REPOSITORIES_DIRECTORY: /service/repositories
      ASSISTANT_WORKFLOWS_DIRECTORY: /service/workflows
      ASSISTANT_VALIDATION_PROFILES_DIRECTORY: /service/validation-profiles
      ASSISTANT_DEPLOYMENT_TARGETS_DIRECTORY: /service/deployment-targets
      ASSISTANT_REPOSITORY_PERSONAL_ASSISTANT_PATH: ${ASSISTANT_REPOSITORY_PERSONAL_ASSISTANT_PATH:-}
      ASSISTANT_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH: ${ASSISTANT_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH:-}
      GEMINI_TTS_API_KEY: ${GEMINI_TTS_API_KEY:-}
      ASSISTANT_GEMINI_TTS_BASE_URL: ${ASSISTANT_GEMINI_TTS_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      ASSISTANT_GEMINI_TTS_MODEL: ${ASSISTANT_GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      ASSISTANT_GEMINI_TTS_VOICE: ${ASSISTANT_GEMINI_TTS_VOICE:-Achird}
      ASSISTANT_GEMINI_TTS_TIMEOUT_SECONDS: ${ASSISTANT_GEMINI_TTS_TIMEOUT_SECONDS:-30}
      ASSISTANT_GEMINI_TTS_CACHE_ENTRIES: ${ASSISTANT_GEMINI_TTS_CACHE_ENTRIES:-128}
      ASSISTANT_GITHUB_TOKEN: ${ASSISTANT_GITHUB_TOKEN:-}
      ASSISTANT_MCP_GATEWAY_URL: ${ASSISTANT_MCP_GATEWAY_URL:-}
      ASSISTANT_MCP_GATEWAY_TOKEN: ${ASSISTANT_MCP_GATEWAY_TOKEN:-}
      ASSISTANT_GITHUB_API_BASE_URL: ${ASSISTANT_GITHUB_API_BASE_URL:-https://api.github.com}
      ASSISTANT_APPROVAL_TOKEN: ${ASSISTANT_APPROVAL_TOKEN:?set ASSISTANT_APPROVAL_TOKEN}
      # The passkey (WebAuthn) site: approvals can be signed with Touch ID or a fingerprint.
      ASSISTANT_PUBLIC_URL: https://${ASSISTANT_DOMAIN}
      ASSISTANT_DEPLOY_SPOOL_DIRECTORY: /deploy
      ASSISTANT_AVATAR_ASSETS_DIR: /avatar-assets
      ASSISTANT_DEFAULT_TIMEZONE: ${ASSISTANT_DEFAULT_TIMEZONE:-Europe/Stockholm}
      # Presence enables "research on the web" proposals; searches run in the worker.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ASSISTANT_KIMI_BASE_URL: ${ASSISTANT_KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      ASSISTANT_KIMI_MODEL: ${ASSISTANT_KIMI_MODEL:-kimi-for-coding-highspeed}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ASSISTANT_MINIMAX_BASE_URL: ${ASSISTANT_MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      ASSISTANT_MINIMAX_MODEL: ${ASSISTANT_MINIMAX_MODEL:-MiniMax-M3}
      ASSISTANT_CONVERSATION_MODEL_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_PROVIDER:-minimax}
      ASSISTANT_DEEPSEEK_MODEL: ${ASSISTANT_DEEPSEEK_MODEL:-deepseek-flash}
      ASSISTANT_DEEPSEEK_THINKING: ${ASSISTANT_DEEPSEEK_THINKING:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-gemini-3.8-flash}
      ASSISTANT_GEMINI_REASONING_EFFORT: ${ASSISTANT_GEMINI_REASONING_EFFORT:-low}
      ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER:-auto}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    expose:
      - "8000"
    volumes:
      # Deploy requests for the host deployer (scripts/host-deployer.sh) and its replies.
      - type: bind
        source: ${ASSISTANT_HOST_DEPLOY_SPOOL:-/srv/personal-assistant/deploy}/requests
        target: /deploy/requests
      - type: bind
        source: ${ASSISTANT_HOST_DEPLOY_SPOOL:-/srv/personal-assistant/deploy}/status
        target: /deploy/status
        read_only: true
      # The Live2D avatar's files (scripts/build_live2d.sh), kept out of the public repo.
      # Empty: the console draws its own avatar instead.
      - type: bind
        source: ${ASSISTANT_AVATAR_ASSETS_HOST:-/srv/personal-assistant/avatar-assets}
        target: /avatar-assets
        read_only: true
    networks:
      - private
      - database
      - egress

  worker:
    build: .
    image: personal-assistant:${ASSISTANT_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:${ASSISTANT_POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_REPOSITORIES_DIRECTORY: /service/repositories
      ASSISTANT_WORKFLOWS_DIRECTORY: /service/workflows
      ASSISTANT_VALIDATION_PROFILES_DIRECTORY: /service/validation-profiles
      ASSISTANT_DEPLOYMENT_TARGETS_DIRECTORY: /service/deployment-targets
      ASSISTANT_DEFAULT_REPOSITORY_ID: ${ASSISTANT_DEFAULT_REPOSITORY_ID:-personal-assistant}
      ASSISTANT_REPOSITORY_PERSONAL_ASSISTANT_PATH: ${ASSISTANT_REPOSITORY_PERSONAL_ASSISTANT_PATH:-}
      ASSISTANT_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH: ${ASSISTANT_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH:-}
      ASSISTANT_WORKER_ID: worker-remote
      ASSISTANT_MCP_GATEWAY_URL: ${ASSISTANT_MCP_GATEWAY_URL:-}
      ASSISTANT_MCP_GATEWAY_TOKEN: ${ASSISTANT_MCP_GATEWAY_TOKEN:-}
      # Read-only use: notice PRs merged or closed on GitHub.
      ASSISTANT_GITHUB_TOKEN: ${ASSISTANT_GITHUB_TOKEN:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ASSISTANT_KIMI_BASE_URL: ${ASSISTANT_KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      ASSISTANT_KIMI_MODEL: ${ASSISTANT_KIMI_MODEL:-kimi-for-coding-highspeed}
      ASSISTANT_KIMI_TIMEOUT_SECONDS: ${ASSISTANT_KIMI_TIMEOUT_SECONDS:-30}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ASSISTANT_MINIMAX_BASE_URL: ${ASSISTANT_MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      ASSISTANT_MINIMAX_MODEL: ${ASSISTANT_MINIMAX_MODEL:-MiniMax-M3}
      ASSISTANT_MINIMAX_TIMEOUT_SECONDS: ${ASSISTANT_MINIMAX_TIMEOUT_SECONDS:-30}
      ASSISTANT_CONVERSATION_MODEL_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_PROVIDER:-minimax}
      ASSISTANT_DEEPSEEK_MODEL: ${ASSISTANT_DEEPSEEK_MODEL:-deepseek-flash}
      ASSISTANT_DEEPSEEK_THINKING: ${ASSISTANT_DEEPSEEK_THINKING:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-gemini-3.8-flash}
      ASSISTANT_GEMINI_REASONING_EFFORT: ${ASSISTANT_GEMINI_REASONING_EFFORT:-low}
      ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER:-auto}
      ASSISTANT_CODE_AGENT_ENABLED: "false"
      ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS: ${ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS:-0.1}
      ASSISTANT_BRIEF_WRITEBACK_ENABLED: ${ASSISTANT_BRIEF_WRITEBACK_ENABLED:-true}
      ASSISTANT_DEFAULT_TIMEZONE: ${ASSISTANT_DEFAULT_TIMEZONE:-Europe/Stockholm}
      ASSISTANT_NTFY_TOPIC_URL: ${ASSISTANT_NTFY_TOPIC_URL:-}
      ASSISTANT_NTFY_TOKEN: ${ASSISTANT_NTFY_TOKEN:-}
      ASSISTANT_PUBLIC_URL: https://${ASSISTANT_DOMAIN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      ASSISTANT_BRIEF_WRITEBACK_IDLE_SECONDS: ${ASSISTANT_BRIEF_WRITEBACK_IDLE_SECONDS:-600}
      ASSISTANT_DEPLOY_SPOOL_DIRECTORY: /deploy
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_liveness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      # The worker only reads deploy results, to finish runs while the API restarts.
      - type: bind
        source: ${ASSISTANT_HOST_DEPLOY_SPOOL:-/srv/personal-assistant/deploy}/status
        target: /deploy/status
        read_only: true
    networks:
      - private
      - database
      - egress

  coding-worker:
    profiles: ["coding"]
    build:
      context: .
      dockerfile: Dockerfile.coding-worker
    image: personal-assistant-coding:${ASSISTANT_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "${ASSISTANT_CODING_WORKER_UID:-1000}:${ASSISTANT_CODING_WORKER_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp/assistant-home
      GIT_ASKPASS: /usr/local/bin/assistant-git-askpass
      GIT_TERMINAL_PROMPT: "0"
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant_coding:${ASSISTANT_CODING_POSTGRES_PASSWORD:?set ASSISTANT_CODING_POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_REPOSITORIES_DIRECTORY: /service/repositories
      ASSISTANT_WORKFLOWS_DIRECTORY: /service/workflows
      ASSISTANT_VALIDATION_PROFILES_DIRECTORY: /service/validation-profiles
      ASSISTANT_DEPLOYMENT_TARGETS_DIRECTORY: /service/deployment-targets
      ASSISTANT_REPOSITORY_PERSONAL_ASSISTANT_PATH: /workspace/repos/personal-assistant
      ASSISTANT_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH: /workspace/repos/analytics-agent-playground
      ASSISTANT_CODE_WORKTREE_ROOT: /workspace/worktrees
      ASSISTANT_CODE_AGENT_ENABLED: "true"
      # In order: the next one takes over when one is rate-limited or not logged in.
      ASSISTANT_CODE_AGENT_PROVIDERS: ${ASSISTANT_CODE_AGENT_PROVIDERS:-claude,codex,kimi,minimax-claude}
      # Claude Code on the Claude subscription (from `claude setup-token`).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Codex on the ChatGPT subscription: its login lives in the codex-home bind below.
      CODEX_HOME: /service-state/codex
      ASSISTANT_CODEX_OWN_SANDBOX: ${ASSISTANT_CODEX_OWN_SANDBOX:-false}
      ASSISTANT_CODE_AGENT_PREFLIGHT_ENABLED: "true"
      ASSISTANT_DEFAULT_REPOSITORY_ID: ${ASSISTANT_DEFAULT_REPOSITORY_ID:-personal-assistant}
      ASSISTANT_WORKER_ID: coding-worker-remote
      ASSISTANT_WORKER_CODING_ONLY: "true"
      ASSISTANT_NTFY_TOPIC_URL: ${ASSISTANT_NTFY_TOPIC_URL:-}
      ASSISTANT_NTFY_TOKEN: ${ASSISTANT_NTFY_TOKEN:-}
      ASSISTANT_PUBLIC_URL: https://${ASSISTANT_DOMAIN}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ASSISTANT_KIMI_BASE_URL: ${ASSISTANT_KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      ASSISTANT_KIMI_CODE_MODEL: ${ASSISTANT_KIMI_CODE_MODEL:-k3.1-pro}
      # The spec writer and the diff reviewer ask the conversation model, so the worker
      # needs the same provider settings as the API.
      ASSISTANT_KIMI_MODEL: ${ASSISTANT_KIMI_MODEL:-kimi-for-coding-highspeed}
      ASSISTANT_MINIMAX_BASE_URL: ${ASSISTANT_MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      ASSISTANT_MINIMAX_MODEL: ${ASSISTANT_MINIMAX_MODEL:-MiniMax-M3}
      ASSISTANT_CONVERSATION_MODEL_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_PROVIDER:-minimax}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ASSISTANT_DEEPSEEK_MODEL: ${ASSISTANT_DEEPSEEK_MODEL:-deepseek-flash}
      ASSISTANT_DEEPSEEK_THINKING: ${ASSISTANT_DEEPSEEK_THINKING:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-gemini-3.8-flash}
      ASSISTANT_GEMINI_REASONING_EFFORT: ${ASSISTANT_GEMINI_REASONING_EFFORT:-low}
      ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER:-auto}
      ASSISTANT_CODING_SPEC_ENABLED: ${ASSISTANT_CODING_SPEC_ENABLED:-true}
      ASSISTANT_CODING_REVIEW_ENABLED: ${ASSISTANT_CODING_REVIEW_ENABLED:-true}
      ASSISTANT_CODING_PLANNER_TIMEOUT_SECONDS: ${ASSISTANT_CODING_PLANNER_TIMEOUT_SECONDS:-90}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ASSISTANT_MINIMAX_ANTHROPIC_BASE_URL: ${ASSISTANT_MINIMAX_ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}
      ASSISTANT_GITHUB_TOKEN: ${ASSISTANT_GITHUB_TOKEN:?set ASSISTANT_GITHUB_TOKEN}
      ASSISTANT_GITHUB_API_BASE_URL: ${ASSISTANT_GITHUB_API_BASE_URL:-https://api.github.com}
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_liveness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    volumes:
      - type: bind
        source: ${ASSISTANT_HOST_REPOSITORY_PERSONAL_ASSISTANT_PATH:-./.coding-repositories/personal-assistant}
        target: /workspace/repos/personal-assistant
      - type: bind
        source: ${ASSISTANT_HOST_REPOSITORY_ANALYTICS_AGENT_PLAYGROUND_PATH:-./.coding-repositories/analytics-agent-playground}
        target: /workspace/repos/analytics-agent-playground
      - type: bind
        source: ${ASSISTANT_HOST_CODE_WORKTREE_ROOT:-./.coding-worktrees}
        target: /workspace/worktrees
      - type: bind
        source: ${ASSISTANT_HOST_CODEX_HOME:-./.codex-home}
        target: /service-state/codex
    networks:
      - database
      - coding-egress

  # The MCP servers (Willys, Lidl) and their gateway, built from the private mcp-servers
  # repository next to this one. Opt-in through the "mcp" profile.
  mcp-tools:
    profiles: ["mcp"]
    build:
      context: ${ASSISTANT_MCP_SERVERS_DIR:-../mcp-servers}
    image: personal-assistant-mcp-tools:${ASSISTANT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      MCP_GATEWAY_TOKEN: ${ASSISTANT_MCP_GATEWAY_TOKEN:-}
      WILLYS_PLUSNUMMER: ${WILLYS_PLUSNUMMER:-}
      WILLYS_PASSWORD: ${WILLYS_PASSWORD:-}
      LIDL_USERNAME: ${LIDL_USERNAME:-}
      LIDL_PASSWORD: ${LIDL_PASSWORD:-}
    volumes:
      - mcp-sessions:/home/node
    # Chromium runs without its own sandbox here, so the container is the boundary.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - private
      - egress

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      ASSISTANT_DOMAIN: ${ASSISTANT_DOMAIN:?set ASSISTANT_DOMAIN}
      ASSISTANT_WEB_USER: ${ASSISTANT_WEB_USER:?set ASSISTANT_WEB_USER}
      ASSISTANT_WEB_PASSWORD_HASH: ${ASSISTANT_WEB_PASSWORD_HASH:?set ASSISTANT_WEB_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private
      - egress

networks:
  private:
    internal: true
  database:
    internal: true
  egress:
  coding-egress:

volumes:
  assistant-postgres:
  mcp-sessions:
  caddy-data:
  caddy-config:
