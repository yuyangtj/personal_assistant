name: personal-assistant

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:?set ASSISTANT_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - assistant-postgres:/var/lib/postgresql/data
    networks:
      - private

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGPASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:?set ASSISTANT_POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -h postgres -U assistant -d assistant -v ON_ERROR_STOP=1 -f "$${migration}"; done
    networks:
      - private

  api:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:${ASSISTANT_POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_CAPABILITIES_DIRECTORY: /service/capabilities
      GEMINI_TTS_API_KEY: ${GEMINI_TTS_API_KEY:-}
      ASSISTANT_GEMINI_TTS_BASE_URL: ${ASSISTANT_GEMINI_TTS_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      ASSISTANT_GEMINI_TTS_MODEL: ${ASSISTANT_GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      ASSISTANT_GEMINI_TTS_VOICE: ${ASSISTANT_GEMINI_TTS_VOICE:-Achird}
      ASSISTANT_GEMINI_TTS_TIMEOUT_SECONDS: ${ASSISTANT_GEMINI_TTS_TIMEOUT_SECONDS:-30}
      ASSISTANT_GEMINI_TTS_CACHE_ENTRIES: ${ASSISTANT_GEMINI_TTS_CACHE_ENTRIES:-128}
      ASSISTANT_GITHUB_TOKEN: ${ASSISTANT_GITHUB_TOKEN:-}
      ASSISTANT_GITHUB_API_BASE_URL: ${ASSISTANT_GITHUB_API_BASE_URL:-https://api.github.com}
      ASSISTANT_APPROVAL_TOKEN: ${ASSISTANT_APPROVAL_TOKEN:?set ASSISTANT_APPROVAL_TOKEN}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"
    networks:
      - private

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://assistant:${ASSISTANT_POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_CAPABILITIES_DIRECTORY: /service/capabilities
      ASSISTANT_WORKER_ID: worker-remote
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      ASSISTANT_KIMI_BASE_URL: ${ASSISTANT_KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      ASSISTANT_KIMI_MODEL: ${ASSISTANT_KIMI_MODEL:-kimi-for-coding-highspeed}
      ASSISTANT_KIMI_TIMEOUT_SECONDS: ${ASSISTANT_KIMI_TIMEOUT_SECONDS:-30}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      ASSISTANT_MINIMAX_BASE_URL: ${ASSISTANT_MINIMAX_BASE_URL:-https://api.minimax.chat/v1}
      ASSISTANT_MINIMAX_MODEL: ${ASSISTANT_MINIMAX_MODEL:-MiniMax-M2.7-highspeed}
      ASSISTANT_MINIMAX_TIMEOUT_SECONDS: ${ASSISTANT_MINIMAX_TIMEOUT_SECONDS:-30}
      ASSISTANT_CONVERSATION_MODEL_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_PROVIDER:-minimax}
      ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER: ${ASSISTANT_CONVERSATION_MODEL_FALLBACK_PROVIDER:-auto}
      ASSISTANT_MANAGER_MODEL_ENABLED: ${ASSISTANT_MANAGER_MODEL_ENABLED:-false}
      ASSISTANT_MANAGER_MODEL_PROVIDER: ${ASSISTANT_MANAGER_MODEL_PROVIDER:-kimi}
      ASSISTANT_MANAGER_MODEL_FALLBACK_PROVIDER: ${ASSISTANT_MANAGER_MODEL_FALLBACK_PROVIDER:-auto}
      ASSISTANT_MANAGER_MODEL_TIMEOUT_SECONDS: ${ASSISTANT_MANAGER_MODEL_TIMEOUT_SECONDS:-30}
      ASSISTANT_MANAGER_MODEL_MINIMUM_CONFIDENCE: ${ASSISTANT_MANAGER_MODEL_MINIMUM_CONFIDENCE:-0.5}
      ASSISTANT_CODE_AGENT_ENABLED: ${ASSISTANT_CODE_AGENT_ENABLED:-false}
      ASSISTANT_CODE_AGENT_PROVIDERS: ${ASSISTANT_CODE_AGENT_PROVIDERS:-kimi,minimax-claude,codex}
      ASSISTANT_CODE_REPOSITORY_PATH: ${ASSISTANT_CODE_REPOSITORY_PATH:-}
      ASSISTANT_CODE_WORKTREE_ROOT: ${ASSISTANT_CODE_WORKTREE_ROOT:-/tmp/personal-assistant-worktrees}
      ASSISTANT_CODE_AGENT_EXECUTABLE: ${ASSISTANT_CODE_AGENT_EXECUTABLE:-codex}
      ASSISTANT_CODE_AGENT_MODEL: ${ASSISTANT_CODE_AGENT_MODEL:-}
      ASSISTANT_KIMI_CODE_EXECUTABLE: ${ASSISTANT_KIMI_CODE_EXECUTABLE:-kimi}
      ASSISTANT_KIMI_CODE_MODEL: ${ASSISTANT_KIMI_CODE_MODEL:-}
      ASSISTANT_CLAUDE_CODE_EXECUTABLE: ${ASSISTANT_CLAUDE_CODE_EXECUTABLE:-claude}
      ASSISTANT_MINIMAX_ANTHROPIC_BASE_URL: ${ASSISTANT_MINIMAX_ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}
      ASSISTANT_MINIMAX_CODE_MODEL: ${ASSISTANT_MINIMAX_CODE_MODEL:-}
      ASSISTANT_CODE_AGENT_RATE_LIMIT_COOLDOWN_SECONDS: ${ASSISTANT_CODE_AGENT_RATE_LIMIT_COOLDOWN_SECONDS:-300}
      ASSISTANT_CODE_AGENT_QUOTA_COOLDOWN_SECONDS: ${ASSISTANT_CODE_AGENT_QUOTA_COOLDOWN_SECONDS:-3600}
      ASSISTANT_CODE_AGENT_TIMEOUT_SECONDS: ${ASSISTANT_CODE_AGENT_TIMEOUT_SECONDS:-1800}
      ASSISTANT_GITHUB_TOKEN: ${ASSISTANT_GITHUB_TOKEN:-}
      ASSISTANT_GITHUB_API_BASE_URL: ${ASSISTANT_GITHUB_API_BASE_URL:-https://api.github.com}
      ASSISTANT_GITHUB_REPOSITORY: ${ASSISTANT_GITHUB_REPOSITORY:-}
      ASSISTANT_GITHUB_BASE_BRANCH: ${ASSISTANT_GITHUB_BASE_BRANCH:-main}
      ASSISTANT_GITHUB_REMOTE: ${ASSISTANT_GITHUB_REMOTE:-origin}
      ASSISTANT_GITHUB_DRAFT_PULL_REQUESTS: ${ASSISTANT_GITHUB_DRAFT_PULL_REQUESTS:-true}
      ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS: ${ASSISTANT_FAKE_EXECUTOR_DELAY_SECONDS:-0.1}
    command: ["python", "-m", "app.worker"]
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASSISTANT_DOMAIN: ${ASSISTANT_DOMAIN:?set ASSISTANT_DOMAIN}
      ASSISTANT_WEB_USER: ${ASSISTANT_WEB_USER:?set ASSISTANT_WEB_USER}
      ASSISTANT_WEB_PASSWORD_HASH: ${ASSISTANT_WEB_PASSWORD_HASH:?set ASSISTANT_WEB_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private

networks:
  private:

volumes:
  assistant-postgres:
  caddy-data:
  caddy-config:
