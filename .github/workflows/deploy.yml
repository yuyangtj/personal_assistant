name: deploy
run-name: >-
  Deploy ${{ github.event_name == 'workflow_run'
  && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

# Every merge to main deploys once CI has passed on it; reviewing and merging the pull
# request is the approval. "Run workflow" redeploys main by hand (or a given commit, which
# must still be main's head), and "force" deploys even while a coding run is executing.
#
# The run asks the site over HTTPS (/deploy/github) to deploy. Its only credential is a
# token GitHub signs for this run (id-token: write); the site checks it came from this
# workflow, on main, in the production environment, then deploys through its host
# deployer. No secret is stored, and SSH stays closed to GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit to deploy (empty = the head of main); must be main's head
        required: false
        type: string
      force:
        description: Deploy even while a coding run is executing (it is interrupted)
        required: false
        type: boolean
        default: false
      workflow_run_id:
        description: Sent by the console's disabled GitHub Actions fallback; unused
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# One deployment at a time; a newer merge waiting here replaces an older waiting one.
concurrency:
  group: personal-assistant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    # Only a CI run for a push to main (a merge), and only when it passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      SITE: ${{ vars.DEPLOY_URL || 'https://assistant.yangyu.se' }}
    steps:
      - name: Choose the commit
        id: commit
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          MAIN_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          sha="${RUN_SHA:-${INPUT_SHA:-${MAIN_SHA}}}"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA: ${sha}"; exit 1; }
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "force=${FORCE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          FORCE: ${{ steps.commit.outputs.force }}
        run: |
          # A fresh token for each request: GitHub's tokens expire within minutes.
          token() {
            curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SITE}" | jq -r .value
          }
          call() {  # call METHOD PATH [BODY]: prints the HTTP status; the reply is in reply.json
            curl -sS -o reply.json -w '%{http_code}' -X "$1" \
              -H "Authorization: Bearer $(token)" -H 'Content-Type: application/json' \
              ${3:+--data "$3"} "${SITE}$2" || echo 000
          }

          body="$(jq -nc --arg sha "${SHA}" --argjson force "${FORCE}" \
            '{commit_sha: $sha, force: $force}')"
          deadline=$(( SECONDS + 3600 ))
          while true; do
            code="$(call POST /deploy/github "${body}")"
            case "${code}" in
              200) jq -r .detail reply.json; exit 0 ;;  # main moved on; skipped
              202) run="$(jq -r .workflow_run_id reply.json)"; break ;;
              409)
                if jq -e .retry_after_seconds reply.json >/dev/null && (( SECONDS < deadline )); then
                  echo "$(jq -r .detail reply.json); asking again in a moment"
                  sleep "$(jq -r .retry_after_seconds reply.json)"
                  continue
                fi ;;
            esac
            echo "The site refused the deploy (HTTP ${code}):"; cat reply.json; echo
            exit 1
          done
          echo "Deploying ${SHA} as ${run}"

          # The API restarts during its own rollout, so a few failed polls are expected.
          deadline=$(( SECONDS + 3000 )); last=""
          while (( SECONDS < deadline )); do
            sleep 10
            [[ "$(call GET "/deploy/github/${run}")" == 200 ]] || continue
            status="$(jq -r .status reply.json)"
            [[ "${status}" != "${last}" ]] && echo "Status: ${status}" && last="${status}"
            case "${status}" in
              completed) jq -r .log_tail reply.json; echo "Deployed."; exit 0 ;;
              failed|cancelled)
                jq -r .log_tail reply.json
                if [[ "$(jq -r .deployer_state reply.json)" == rolled_back ]]; then
                  echo "::error::The release failed its health checks and was rolled back."
                else
                  echo "::error::The deployment failed; the log above says why."
                fi
                exit 1 ;;
            esac
          done
          echo "::error::No outcome within 50 minutes; check the console for deployment ${run}."
          exit 1
